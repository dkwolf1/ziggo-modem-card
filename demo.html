<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ziggo Modem · Neon</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #f3f4f7; background: radial-gradient(ellipse at 15% 12%, #302219, transparent 52%), #0c1018; font: 16px system-ui, sans-serif; }
    .preview { width: min(100% - 48px, 1100px); margin: auto; padding: 26px 0 34px; }
    h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 32px); }
    p { margin: 0 0 24px; color: #c9c8cf; }
    main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
    h2 { margin: 0 0 10px; font-size: 14px; font-weight: 600; color: #d3c8c0; }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; } .preview { width: calc(100% - 28px); } }
  </style>
</head>
<body>
  <div class="preview">
    <header>
      <h1>Ziggo Modem · Neon</h1>
      <p>Home Assistant-dashboardkaart met fictieve modemgegevens.</p>
    </header>
    <main>
      <section><h2>Uitgebreid</h2><div id="large"></div></section>
      <section><h2>Compact</h2><div id="small"></div></section>
    </main>
  </div>
  <script type="module">
    import './dist/ziggo-modem-card.js';
    const updatedAt = new Date().toISOString();
    const readings = {
      status: ['Operational'],
      uptime: ['14d 06u'],
      signal_quality: ['Matig', { score: 75, reden: 'Downstream SNR verlaagd' }],
      ds_snr: ['36.4', { unit_of_measurement: 'dB' }],
      ds_power: ['1.2', { unit_of_measurement: 'dBmV' }],
      us_power: ['44.8', { unit_of_measurement: 'dBmV' }],
      ds_rate: ['1000', { unit_of_measurement: 'Mbit/s' }],
      us_rate: ['100', { unit_of_measurement: 'Mbit/s' }],
      internet_access: ['on', { device_class: 'connectivity' }],
      cable_issue: ['off', { device_class: 'problem' }],
      last_successful_update: [updatedAt],
      connection_interruptions: ['1'],
      us_t3: ['0'],
      failed_updates: ['0'],
      line_stability: ['Licht wisselend'],
      api_status: ['OK'],
      ds_uncorrected_ofdm: ['0'],
    };
    const states = {};
    const registry = [];
    for (const [key, [state, attributes = {}]] of Object.entries(readings)) {
      const domain = attributes.device_class ? 'binary_sensor' : 'sensor';
      const entity_id = `${domain}.ziggo_modem_${key}`;
      states[entity_id] = { entity_id, state, attributes, last_updated: updatedAt };
      registry.push({ platform: 'ziggo_modem', device_id: 'demo-modem', entity_id, unique_id: `demo_${key}` });
    }
    const hass = {
      locale: { language: 'nl' },
      states,
      callWS: async () => registry,
      callApi: async (_method, path) => {
        const [period, query] = path.split('?');
        const start = Date.parse(decodeURIComponent(period.split('/').pop()));
        const end = Date.parse(new URLSearchParams(query).get('end_time'));
        const samples = Array.from({ length: 80 }, (_, index) => ({
          entity_id: 'sensor.ziggo_modem_ds_snr',
          last_changed: new Date(start + (end - start) * index / 79).toISOString(),
          state: (36.4 + Math.sin(index * .55) * .4 + Math.cos(index * 1.8) * .15).toFixed(2),
        }));
        return [samples];
      },
    };
    for (const [id, layout] of [['large', 'expanded'], ['small', 'compact']]) {
      const card = document.createElement('ziggo-modem-card');
      document.getElementById(id).append(card);
      card.setConfig({ type: 'custom:ziggo-modem-card', layout });
      card.hass = hass;
    }

  </script>
</body>
</html>
