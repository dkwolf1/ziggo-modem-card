<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ziggo Modem · Neon</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: #f3f4f7;
        background:
          radial-gradient(ellipse at 15% 12%, #302219, transparent 52%), #0c1018;
        font:
          16px system-ui,
          sans-serif;
      }
      .preview {
        width: min(100% - 48px, 1100px);
        margin: auto;
        padding: 26px 0 34px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: clamp(24px, 4vw, 32px);
      }
      p {
        margin: 0 0 24px;
        color: #c9c8cf;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 600;
        color: #d3c8c0;
      }
      @media (max-width: 720px) {
        main {
          grid-template-columns: 1fr;
        }
        .preview {
          width: calc(100% - 28px);
        }
      }
    </style>
  </head>
  <body>
    <div class="preview">
      <header>
        <h1>Ziggo Modem · Neon</h1>
        <p>Home Assistant-dashboardkaart met fictieve modemgegevens.</p>
      </header>
      <main>
        <section>
          <h2>Uitgebreid</h2>
          <div id="large"></div>
        </section>
        <section>
          <h2>Compact</h2>
          <div id="small"></div>
        </section>
      </main>
    </div>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
